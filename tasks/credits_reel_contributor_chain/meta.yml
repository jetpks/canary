category: "Polymorphism over type-switching, two levels deep: both a collaborator and what it returns must be treated only through their documented protocols"
adapter: minitest
provenance: authored
statement: "Implement CreditsReel.new(entries), constructed with a single positional Array of entry collaborators. Each element of entries may be any object that responds to #contributor, returning a person collaborator - no other method or class is assumed of the entry itself. Each such person collaborator, in turn, may be any object that responds to #display_name (returning a String full name) and #handle (returning a String short identifier) - no other method or class is assumed of the person either. #names returns an Array of every entry's contributor's #display_name, one per entry, in the same order as entries. #handles returns an Array of every entry's contributor's #handle, one per entry, in the same order as entries. This must work for any mix of entry shapes and any mix of person shapes, whatever their internal implementation - for instance, one entry's contributor might be looked up lazily and another might be stored directly, and one person's #display_name might be computed by joining stored parts while another's is stored as a single value - but CreditsReel itself must not assume any particular shape at either level."
broken:
  - id: type_switches_on_known_person_class
    misconception: "names dispatches with a case/when on the one person class seen during development instead of just calling #display_name on whatever entry.contributor returns, raising ArgumentError for any person collaborator whose class isn't that one - correct for a mix of only the anticipated person shape, wrong for any other protocol-honoring person."
  - id: handles_uses_display_name
    misconception: "names calls entry.contributor.display_name correctly for any entry or person shape, but handles also calls entry.contributor.display_name instead of entry.contributor.handle, a copy-paste slip that returns the full name where the short identifier was asked for, regardless of entry or person shape."
  - id: mechanism_free
    misconception: "names and handles call entry.display_name and entry.handle directly on each entry instead of on entry.contributor, collapsing the two-level chain into a single hop - correct for nothing, since no entry itself implements either method, only its contributor does."
