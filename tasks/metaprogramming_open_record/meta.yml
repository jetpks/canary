category: metaprogramming
adapter: minitest
provenance: authored
statement: "Implement OpenRecord.new(**attrs), a dynamic attribute store: each keyword given at construction is readable via a matching getter method, and calling any assignment-style method (e.g. record.age = 37) sets that attribute so it becomes newly readable too - even for an attribute never given at construction. record.respond_to?(:name) and record.respond_to?(:name=) must return true for every attribute name that actually works this way. Calling a getter for a name that was never set raises NoMethodError, exactly as it would for any object with no such method."
broken:
  - id: missing_respond_to_missing
    misconception: "method_missing works but respond_to_missing? is never overridden, so respond_to?/respond_to_missing? consumers see false for attributes that actually work."
  - id: write_path_no_ops
    misconception: "method_missing's key= branch computes the attribute key but never assigns it into @attrs, so writes silently vanish."
  - id: mechanism_free
    misconception: "defines a fixed getter per construction-time attribute via define_singleton_method instead of method_missing/respond_to_missing?, so no attribute set later is ever readable, writable, or respond_to?-true."
