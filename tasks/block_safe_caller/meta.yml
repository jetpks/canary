    misconception: "drops the callable.lambda? guard, so a Proc with a matching arity check gets the default fallback treatment reserved for lambdas."
  - id: inverted_arity_check
    misconception: "arity == args.size (inverted from !=): defaults on a matching call and attempts (and crashes) the real call on a mismatch."
