category: the Comparable protocol and <=> contracts
adapter: rspec
provenance: authored
statement: "Implement Money.new(cents), constructed with a single positional integer argument stored and exposed via a public #cents reader, including Comparable, so instances order strictly by the numeric magnitude of cents - Money.new(9) is less than Money.new(10) - and support ==, sort, and clamp accordingly."
broken:
  - id: lexical_string_compare
    misconception: "<=> compares cents.to_s lexically instead of numerically, so 9 sorts after 10."
  - id: reversed_comparison
    misconception: "<=> compares other.cents <=> cents (operands swapped), inverting the ordering entirely."
  - id: mechanism_free
    misconception: "hand-rolls <=>, <, ==, and clamp directly instead of including Comparable, so >, <=, >=, and between? are never defined."
