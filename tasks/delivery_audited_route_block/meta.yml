category: "Liskov substitution: a subclass's override must forward an argument-carrying block faithfully in every combination of block presence and yielded data"
adapter: minitest
provenance: authored
statement: "Implement Delivery.new (no constructor arguments). #log(tracking_id, status) records status (a String) under tracking_id, overwriting any status already recorded there. #route(tracking_id), given a block, calls the block with two arguments - tracking_id, and the status currently recorded for it, or nil if none has been recorded - and returns whatever the block returns. #route(tracking_id) called without a block returns the status currently recorded for tracking_id, or nil if none has been recorded, without calling anything and without raising merely because tracking_id has no recorded status. Implement AuditedDelivery < Delivery (also constructed with AuditedDelivery.new, no arguments), which additionally records every #route call: #audit_trail (an Array reader, starting empty) gains one [tracking_id, status_or_nil] pair - using the same tracking_id and status_or_nil values #route's contract above defines - appended in call order, for every #route call, regardless of whether that call was given a block and regardless of whether tracking_id had a recorded status. #route on an AuditedDelivery instance must otherwise behave exactly per Delivery's #route contract above, honoring both the with-block and without-block forms and forwarding the block's return value when a block is given."
broken:
  - id: crashes_without_a_block
    misconception: "route captures the caller's block with &block and always passes an internal wrapper block down to super so it can audit the call, then has the wrapper unconditionally call block.call(id, status) - correct when the caller did supply a block, but when #route is called with no block at all, block is nil and block.call raises NoMethodError instead of just returning the recorded status per the base contract."
  - id: swaps_block_arguments
    misconception: "route forwards presence-or-absence of a block correctly (never raising on the blockless form), and audits every call correctly, but when a block was given it yields the two arguments to the caller's block in the order (status, tracking_id) instead of (tracking_id, status), regardless of whether tracking_id had a recorded status."
  - id: mechanism_free
    misconception: "AuditedDelivery#initialize never calls super, so Delivery's own storage is never set up and #log/#route break entirely on a fresh AuditedDelivery, regardless of the block-forwarding question."
