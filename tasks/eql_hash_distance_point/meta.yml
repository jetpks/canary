category: "Comparable gives == via <=>, but Hash keys, uniq, and Array#- need eql?/hash too"
adapter: rspec
statement: "Implement Point(x, y). Point instances order by distance from the origin - e.g. Point.new(5, 0) is less than Point.new(1, 10) - and support sort accordingly. Two points with the same x and y must be treated as fully equal: they collapse to a single entry under Array#uniq, and using either as a Hash key reaches the same stored value as using the other."
broken:
  - id: missing_eql_and_hash
    misconception: "Comparable gives == via <=>, but eql?/hash are never overridden, so they fall back to identity - equal-valued points collide neither as Hash keys nor under uniq."
  - id: orders_by_x_only
    misconception: "eql?/hash are implemented correctly, but <=> compares x alone instead of distance, so ordering is wrong while the Hash/uniq behavior is fine."
  - id: mechanism_free
    misconception: "includes Comparable for ordering but never overrides eql?/hash, so equal-valued points fall back to identity for Hash keys and uniq - same misconception as missing_eql_and_hash."
