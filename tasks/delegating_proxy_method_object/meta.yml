category: "a delegating wrapper's respond_to? and Kernel#method must agree with what it actually dispatches, not just what it directly defines"
adapter: rspec
provenance: authored
statement: "Implement Proxy.new(target), constructed with a single object to wrap. Calling any method on the proxy that target itself responds to forwards that call to target with the same arguments, and returns whatever that call on target returns - for any such method name, not only ones anticipated ahead of time. proxy.respond_to?(:name) returns true for every method name target responds to (in addition to any method Proxy itself directly defines), and false for a name neither target nor Proxy supports. proxy.method(:name) for a method name target responds to succeeds and returns a callable whose #call behaves exactly like calling that method on the proxy directly, with the same arguments. proxy.method(:name) for a name neither target nor Proxy supports raises NameError, exactly as it would for any object with no such method. Calling a method on the proxy that neither target nor Proxy supports raises NoMethodError, exactly as it would for any object with no such method."
broken:
  - id: missing_respond_to_missing
    misconception: "forwarding is implemented, so calling a forwarded method directly works fine, but the hook respond_to?/method consult for dynamically-handled names is never overridden - so proxy.respond_to?(:name) wrongly reports false for a name target actually supports, and proxy.method(:name) wrongly raises NameError for it instead of returning a working callable."
  - id: silently_ignores_unsupported_calls
    misconception: "the hook respond_to?/method consult is correctly overridden, but the forwarding method itself returns nil for a name neither target nor Proxy supports instead of deferring to the default no-such-method behavior - so calling an unsupported method on the proxy silently returns nil instead of raising NoMethodError."
  - id: mechanism_free
    misconception: "forwarding is implemented, so calling a forwarded method directly works fine, but the hook respond_to?/method consult for dynamically-handled names is never overridden - so proxy.respond_to?(:name) wrongly reports false for a name target actually supports, and proxy.method(:name) wrongly raises NameError for it instead of returning a working callable - same misconception as missing_respond_to_missing."
