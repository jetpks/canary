category: "Dependency injection meets the copy protocol: a #dup copy must own independent state while still honoring the collaborator it was constructed with"
adapter: rspec
provenance: authored
statement: "Implement ExpenseTracker.new(rounding: ExpenseTracker::NearestCent.new) - a keyword argument rounding that defaults to a new instance of ExpenseTracker::NearestCent (a class your solution must also define, nested under ExpenseTracker) when the caller omits it. rounding may be any object responding to #round(amount), returning the numeric amount rounded to that collaborator's own precision - no other method or class is assumed of it. #record(amount) rounds amount via rounding.round(amount), appends the rounded value to this tracker's own accumulated records, and returns the tracker itself. #total returns the sum of every rounded amount recorded on this tracker so far, or 0 if none have been recorded. ExpenseTracker::NearestCent#round(amount) returns amount rounded to the nearest 0.01. #dup produces a new, independent tracker: recording on the copy afterward never affects the original's #total, and recording on the original afterward never affects the copy's #total - but the copy keeps rounding through the exact rounding collaborator the original was constructed with, not a fresh default one."
broken:
  - id: shares_records_array
    misconception: "no initialize_copy override is provided, on the mistaken belief that dup needs no special handling at all - the default shallow copy leaves the copy's own accumulated records pointing at the exact same Array as the original's, so recording on either one after the copy is made silently changes both trackers' totals together."
  - id: dup_reverts_to_default_rounding
    misconception: "initialize_copy correctly gives the copy its own independent records array, but it also resets the copy's rounding collaborator to a fresh ExpenseTracker::NearestCent.new, on the mistaken belief that a copy's collaborators must be reconstructed from scratch - so a copy made from a tracker constructed with a non-default rounding collaborator silently starts rounding through the default instead of the one it was actually built with."
  - id: mechanism_free
    misconception: "no initialize_copy override is provided, on the mistaken belief that dup needs no special handling at all - the default shallow copy leaves the copy's own accumulated records pointing at the exact same Array as the original's, so recording on either one after the copy is made silently changes both trackers' totals together - same misconception as shares_records_array."
