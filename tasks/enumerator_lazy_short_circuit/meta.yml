category: "Enumerator::Lazy short-circuits per-element; the eager equivalent evaluates everything before slicing"
adapter: rspec
statement: "Implement Finder.first_matching(source, n, &predicate), returning an Array of the first n elements of source for which predicate is true, in source order - while calling predicate on as few elements of source as possible, never more than a small constant beyond what's needed to find the n matches. source may be very large or unbounded, so this must not evaluate predicate against elements beyond the ones needed to produce the n matches."
broken:
  - id: eager_select
    misconception: "source.select(&predicate).first(n) - no .lazy - evaluates the predicate against every element of source before first(n) ever gets to slice it, giving the right answer at a much higher, unbounded cost."
  - id: first_before_select
    misconception: "source.lazy.first(n).select(&predicate) - first(n) forces evaluation and returns a plain Array before select ever filters it, so the result reflects the first n raw elements, not the first n matches."
