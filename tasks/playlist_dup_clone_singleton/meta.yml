category: "dup vs clone: singleton methods and extended modules survive clone but not dup, and clone(freeze:) can override the default frozen-state match explicitly"
adapter: rspec
provenance: authored
statement: "Implement Playlist.new(tracks = []), constructed from an optional starting array of tracks. #add(track) appends track and returns the playlist itself. #tracks returns the playlist's current tracks, in insertion order. #dup and #clone must each produce a playlist whose #tracks is independent of the original - adding to the copy's tracks must never affect the original's tracks, and vice versa. Any singleton behavior added directly to one particular playlist object (for example, defining an extra method on that object alone, or extending it with a module after construction) is not carried over to a copy made with #dup, but is carried over to a copy made with #clone. #freeze, #frozen?, #dup, and #clone otherwise behave exactly as they do for any Ruby object: #dup's result is never frozen regardless of the original, #clone's result matches the original's frozen state by default, and passing clone(freeze: true) or clone(freeze: false) overrides that default explicitly in either direction, regardless of whether the original was frozen."
broken:
  - id: reimplements_dup_and_clone
    misconception: "dup and clone are redefined from scratch as plain methods that build a new Playlist and, for clone, re-freeze it - so both copies do get independent tracks arrays, but neither copy carries over singleton methods or extended modules (since building a brand-new object never copies the original's singleton class), and clone(freeze: true/false) breaks entirely (the hand-rolled #clone takes no arguments, so passing freeze: raises ArgumentError instead of overriding the frozen state)."
  - id: shares_tracks_between_copies
    misconception: "no initialize_copy override is provided, on the mistaken belief that dup and clone need no special handling at all - the default shallow copy leaves the copy's @tracks pointing at the exact same Array as the original, so adding to either one's tracks silently mutates both."
  - id: mechanism_free
    misconception: "no initialize_copy override is provided, on the mistaken belief that dup and clone need no special handling at all - the default shallow copy leaves the copy's @tracks pointing at the exact same Array as the original, so adding to either one's tracks silently mutates both - same misconception as shares_tracks_between_copies."
